<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro — Visual Task Management Board</title>
    <meta name="description" content="A sleek, responsive task board application with drag-and-drop workflow management, real-time analytics, and local storage persistence.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/board.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>
    <div class="app-container">
        <!-- Main Top Bar & Header -->
        <header class="app-header">
            <div class="header-top">
                <div class="brand">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <h1>TaskFlow <span class="badge-pro">PRO</span></h1>
                        <p class="subtitle">Smart Visual Workflow Management</p>
                    </div>
                </div>

                <div class="header-actions">
                    <button id="themeToggleBtn" class="btn btn-icon" title="Toggle Light/Dark Theme" aria-label="Toggle Light/Dark Theme">
                        <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>

                    <div class="dropdown">
                        <button id="dataMenuBtn" class="btn btn-outline" title="Data Options">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span>Backup & Restore</span>
                        </button>
                        <div id="dataDropdown" class="dropdown-content hidden">
                            <button id="exportBtn" class="dropdown-item">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                Export Board JSON
                            </button>
                            <label for="importFileInput" class="dropdown-item file-label">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                Import Board JSON
                            </label>
                            <input type="file" id="importFileInput" accept=".json" class="hidden-input">
                            <button id="clearTasksBtn" class="dropdown-item danger">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                Clear All Tasks
                            </button>
                        </div>
                    </div>

                    <button id="addTaskBtn" class="btn btn-primary btn-glow">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>New Task</span>
                    </button>
                </div>
            </div>

            <!-- Stats Analytics Bar -->
            <div class="stats-dashboard">
                <div class="stat-card">
                    <div class="stat-icon stat-total">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="statTotal">0</span>
                        <span class="stat-label">Total Tasks</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-completed">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="statCompleted">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-progress">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="statProgress">0%</span>
                        <span class="stat-label">Progress Rate</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-overdue">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-value" id="statOverdue">0</span>
                        <span class="stat-label">Overdue</span>
                    </div>
                </div>
            </div>

            <!-- Search, Filter & Control Toolbar -->
            <div class="toolbar">
                <div class="search-box">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="searchInput" placeholder="Search tasks by title, tag, or details..." aria-label="Search tasks">
                    <button id="clearSearchBtn" class="clear-btn hidden" aria-label="Clear search">&times;</button>
                </div>

                <div class="filter-group">
                    <div class="filter-item">
                        <label for="priorityFilter">Priority:</label>
                        <select id="priorityFilter">
                            <option value="all">All Priorities</option>
                            <option value="urgent">🔥 Urgent</option>
                            <option value="high">🔴 High</option>
                            <option value="medium">🟡 Medium</option>
                            <option value="low">🟢 Low</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <label for="categoryFilter">Category:</label>
                        <select id="categoryFilter">
                            <option value="all">All Categories</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <label for="sortBy">Sort By:</label>
                        <select id="sortBy">
                            <option value="created-desc">Newest First</option>
                            <option value="created-asc">Oldest First</option>
                            <option value="dueDate-asc">Due Date (Earliest)</option>
                            <option value="priority-desc">Priority (High to Low)</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <!-- Kanban Task Board Columns Area -->
        <main class="board-wrapper">
            <div class="board-grid" id="boardGrid">
                <!-- Column 1: To Do -->
                <div class="board-column" data-status="todo">
                    <div class="column-header">
                        <div class="column-title-group">
                            <span class="column-indicator indicator-todo"></span>
                            <h2>To Do</h2>
                            <span class="task-count-pill" id="count-todo">0</span>
                        </div>
                        <button class="btn-quick-add" data-status="todo" title="Add task to To Do" aria-label="Add task to To Do">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    </div>
                    <div class="task-list" id="list-todo" data-status="todo"></div>
                </div>

                <!-- Column 2: In Progress -->
                <div class="board-column" data-status="in-progress">
                    <div class="column-header">
                        <div class="column-title-group">
                            <span class="column-indicator indicator-progress"></span>
                            <h2>In Progress</h2>
                            <span class="task-count-pill" id="count-in-progress">0</span>
                        </div>
                        <button class="btn-quick-add" data-status="in-progress" title="Add task to In Progress" aria-label="Add task to In Progress">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    </div>
                    <div class="task-list" id="list-in-progress" data-status="in-progress"></div>
                </div>

                <!-- Column 3: Under Review -->
                <div class="board-column" data-status="review">
                    <div class="column-header">
                        <div class="column-title-group">
                            <span class="column-indicator indicator-review"></span>
                            <h2>Under Review</h2>
                            <span class="task-count-pill" id="count-review">0</span>
                        </div>
                        <button class="btn-quick-add" data-status="review" title="Add task to Under Review" aria-label="Add task to Under Review">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    </div>
                    <div class="task-list" id="list-review" data-status="review"></div>
                </div>

                <!-- Column 4: Completed -->
                <div class="board-column" data-status="completed">
                    <div class="column-header">
                        <div class="column-title-group">
                            <span class="column-indicator indicator-completed"></span>
                            <h2>Completed</h2>
                            <span class="task-count-pill" id="count-completed">0</span>
                        </div>
                        <button class="btn-quick-add" data-status="completed" title="Add task to Completed" aria-label="Add task to Completed">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        </button>
                    </div>
                    <div class="task-list" id="list-completed" data-status="completed"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Task Create / Edit Modal -->
    <div id="taskModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modalTitle">Create New Task</h2>
                <button id="closeModalBtn" class="btn-close" aria-label="Close Modal">&times;</button>
            </div>
            <form id="taskForm" class="modal-form">
                <input type="hidden" id="taskId">
                
                <div class="form-group">
                    <label for="taskTitleInput">Task Title <span class="required">*</span></label>
                    <input type="text" id="taskTitleInput" placeholder="What needs to be done?" required autofocus>
                </div>

                <div class="form-group">
                    <label for="taskDescInput">Description</label>
                    <textarea id="taskDescInput" rows="3" placeholder="Add detailed notes or requirements..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskStatusInput">Column Status</label>
                        <select id="taskStatusInput">
                            <option value="todo">To Do</option>
                            <option value="in-progress">In Progress</option>
                            <option value="review">Under Review</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="taskPriorityInput">Priority</label>
                        <select id="taskPriorityInput">
                            <option value="low">🟢 Low</option>
                            <option value="medium" selected>🟡 Medium</option>
                            <option value="high">🔴 High</option>
                            <option value="urgent">🔥 Urgent</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="taskCategoryInput">Category / Tag</label>
                        <input type="text" id="taskCategoryInput" placeholder="e.g. Design, Frontend, Feature" list="categorySuggestions">
                        <datalist id="categorySuggestions">
                            <option value="Design"></option>
                            <option value="Frontend"></option>
                            <option value="Backend"></option>
                            <option value="Bugfix"></option>
                            <option value="Marketing"></option>
                        </datalist>
                    </div>

                    <div class="form-group">
                        <label for="taskDueDateInput">Due Date</label>
                        <input type="date" id="taskDueDateInput">
                    </div>
                </div>

                <!-- Subtasks Management -->
                <div class="form-group">
                    <div class="subtask-header">
                        <label>Subtasks</label>
                        <span class="subtask-hint">Break down into actionable steps</span>
                    </div>
                    <div id="subtasksContainer" class="subtasks-container">
                        <!-- Dynamic subtask items will be injected here -->
                    </div>
                    <div class="add-subtask-row">
                        <input type="text" id="newSubtaskInput" placeholder="Add a subtask item...">
                        <button type="button" id="addSubtaskBtn" class="btn btn-secondary btn-sm">Add Step</button>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" id="saveTaskBtn" class="btn btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirmModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
        <div class="modal-card modal-sm">
            <div class="modal-header">
                <h2>Delete Task?</h2>
                <button id="closeConfirmBtn" class="btn-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete <strong id="confirmTaskTitle">this task</strong>? This action cannot be undone.</p>
            </div>
            <div class="modal-footer">
                <button id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
                <button id="confirmDeleteBtn" class="btn btn-danger">Delete Task</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden"></div>

    <!-- JavaScript Modules -->
    <script src="js/storage.js"></script>
    <script src="js/taskModal.js"></script>
    <script src="js/board.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
